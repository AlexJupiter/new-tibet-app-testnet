server {
 listen 80;
 server_name _;
 client_max_body_size 32m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'self' https://ethereum-sepolia-rpc.publicnode.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
 location /api/ {proxy_pass http://api:3001;proxy_set_header Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-Forwarded-Proto $scheme;proxy_read_timeout 60s;}
 location /.well-known/ {proxy_pass http://api:3001;proxy_set_header Host $host;}
 location / {try_files $uri $uri/ /index.html;}
}
