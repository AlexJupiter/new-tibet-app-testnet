name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: newtibet_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/newtibet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contracts:compile
      - run: git diff --exit-code packages/protocol/generated/resolver.json
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run mobile:export
      - run: npm run web:build
        env:
          EXPO_WEB_BASE_URL: /new-tibet-app-testnet-pages
      - uses: actions/upload-artifact@v4
        with:
          name: admin-production
          path: apps/admin/dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-js-bundles
          path: apps/mobile/dist
      - uses: actions/upload-artifact@v4
        with:
          name: member-website
          path: apps/mobile/dist-web
