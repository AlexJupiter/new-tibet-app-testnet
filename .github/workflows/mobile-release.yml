name: Build signed mobile releases
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: mobile-production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EXPO_PUBLIC_PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
      EXPO_PUBLIC_PRIVY_CLIENT_ID: ${{ vars.PRIVY_CLIENT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      EXPO_PUBLIC_PASSKEY_DOMAIN: ${{ vars.PASSKEY_DOMAIN }}
      EXPO_PUBLIC_SEPOLIA_RPC_URL: ${{ vars.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run contracts:compile && git diff --exit-code packages/protocol/generated/resolver.json
      - run: npm run typecheck && npm test && npm run build
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.13.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build iOS IPA and Android AAB
        working-directory: apps/mobile
        run: eas build --platform all --profile production --non-interactive --wait
